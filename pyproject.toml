[project]
name = "postgres-maf"
version = "1.0.0"
description = "A didactic sample: an AI agent that reads and writes an Azure PostgreSQL database through the Postgres MCP Server, implemented twice - with the Microsoft Agent Framework and with the Foundry Agent Service."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # --- Microsoft Agent Framework (MAF) ---------------------------------
    # `agent-framework-core` gives us Agent, AgentSession and the MCP tools.
    # `agent-framework-openai` ships OpenAIChatClient, which is what talks to
    # Azure OpenAI. Core alone raises ModuleNotFoundError when you import it.
    #
    # The two packages are versioned independently: agent-framework-openai
    # 1.14.x already requires agent-framework-core >=1.17. The mismatched
    # numbers are expected, not a typo.
    "agent-framework-core>=1.17,<2",
    "agent-framework-openai>=1.14,<2",

    # --- Microsoft Foundry Agent Service ---------------------------------
    # Only needed by the src/foundry/ variant, which registers the agent in a
    # Foundry project instead of building it in memory. Pulls in the `openai`
    # package, which is how the Responses API is reached.
    # See docs/implementations.md.
    "azure-ai-projects>=2.6,<3",

    # The MCP client library that MAF's MCP tools are built on top of.
    # The Foundry variant uses it directly, to drive the MCP session itself.
    "mcp>=1.24,<2",

    # Entra ID (Azure AD) authentication for Azure OpenAI - this is what makes
    # `az login` enough to run the sample, with no API keys in your .env.
    "azure-identity>=1.19",

    # Loads the .env file produced by infra/provision.*
    "python-dotenv>=1.0",

    # Only used by infra/seed.py to apply the schema. The *agent* never uses
    # psycopg - it reaches Postgres exclusively through the MCP server.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

# The local web UI (src/ui/). Optional because both CLIs run without it:
#   pip install -e ".[ui]"   then   python -m src.ui.server
ui = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

# Only infra/make_workbook.py needs this, and the workbook it produces is
# committed - so you need it only to change the sample data.
workbook = ["openpyxl>=3.1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# openpyxl refuses timezone-aware datetimes, so the maintenance windows in the
# sample workbook have to be naive.
"infra/make_workbook.py" = ["DTZ001"]
